services:
  neo4j:
    image: neo4j:5.23-community
    container_name: rag-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-please-change-me}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rag-backend
    profiles: ["full"]   # `docker compose --profile full up` to run everything
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      args:
        # baked into the bundle at build time — see frontend/Dockerfile
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_API_KEY: ${API_KEY:-}
        BACKEND_URL: http://backend:8000
    container_name: rag-frontend
    profiles: ["full"]
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
